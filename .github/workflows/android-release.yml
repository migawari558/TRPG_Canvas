name: Build signed Android release
on:
  push:
    tags: ['android-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: node --test tests/mobile-sync.test.cjs tests/mobile-compat.test.cjs
      - run: npm run android:sync
      - name: Prepare fixed release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'ANDROID_KEYSTORE_BASE64 must contain a permanent release key'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PmobileVersion="$VERSION" -PmobileVersionCode="$GITHUB_RUN_NUMBER"
      - name: Create draft Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "TRPG-Canvas-${GITHUB_REF_NAME}.apk"
          sha256sum "TRPG-Canvas-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "TRPG-Canvas-${GITHUB_REF_NAME}.apk" SHA256SUMS.txt --verify-tag --draft --latest=false --title "TRPG Canvas ${GITHUB_REF_NAME}" --notes-file docs/ANDROID-RELEASE-NOTES.md
