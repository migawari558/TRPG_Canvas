name: Update user guide Wiki
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: user-guide-wiki
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish current guides
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraHeader="AUTHORIZATION: basic $AUTH" clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          node scripts/publish-wiki.cjs "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "docs: update user guide for ${GITHUB_REF_NAME}"
            git -c http.extraHeader="AUTHORIZATION: basic $AUTH" push origin HEAD
          fi
